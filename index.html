<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="https://looti-merchant.fastest-iq.com/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="منصة أصحاب المتاجر — Looti">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Looti">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!--
    Fetch the brand face alongside the engine instead of after it.

    Without this the first frame paints in the browser's fallback sans and
    re-flows once Neo Sans Arabic arrives — which is the wrong typeface on
    screen for as long as the download takes. The three weights below are the
    ones the type ramp uses; the rest load afterwards.
  -->
  <link rel="preload" as="font" type="font/ttf" crossorigin
        href="assets/fonts/NeoSansArabic-Regular.ttf">
  <link rel="preload" as="font" type="font/ttf" crossorigin
        href="assets/fonts/NeoSansArabic-Medium.ttf">
  <link rel="preload" as="font" type="font/ttf" crossorigin
        href="assets/fonts/NeoSansArabic-Bold.ttf">

  <title>Looti — منصة أصحاب المتاجر</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
